name: Run
run-name: "${{ inputs.paper }} ${{ inputs.role }}"

# One run of an Encore attempt (README.md), to make an attempt step by step or to take one up where it stopped; the
# Attempt workflow makes a whole attempt. The protocol's own workflows do the run: papers.yml for the reader's runs,
# attempt.yml for the rest. With the input `registry` they read the registry and write nothing to it: the run
# starts from this repository's branch attempt/<paper>, and ends by signing its results and adding them to that
# branch (encore-protocol docs/outside-runs.md). The Send workflow sends the finished attempt to the registry.

on:
  workflow_dispatch:
    inputs:
      paper:
        description: "The paper's key in the registry (papers/keys.yaml), such as smith-2020"
        required: true
      role:
        description: "The run to make, in the order of the list"
        type: choice
        options: [claims, claims-check, author, answer, author-answers, verifier-1, author-revise-1, verifier-2, author-revise-2, verifier-3, author-revise-3, reconcile, recorder]
        required: true
      model:
        description: "The model the run uses"
        default: claude-opus-5-5
      account:
        description: "Which of this repository's Claude accounts the run uses"
        type: choice
        options: [verified, unverified, api]
        default: verified

# contents: the run pushes the attempt's state to this repository's own branch. id-token and attestations: it signs
# its results.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # The protocol is pinned to its main branch while this repository is being tried; it moves to a release tag of
  # encore-protocol before anyone else runs it.
  reader:
    if: contains(fromJSON('["claims", "claims-check", "answer"]'), inputs.role)
    uses: encorescience/encore-protocol/.github/workflows/papers.yml@main
    with:
      paper: ${{ inputs.paper }}
      role: ${{ inputs.role }}
      model: ${{ inputs.model }}
      account: ${{ inputs.account }}
      registry: encorescience/encore-registry
      papers_repo: ${{ vars.ENCORE_PAPERS_REPO }}
      accountable: ${{ vars.ENCORE_ACCOUNTABLE }}
    # By name, not `secrets: inherit`: GitHub passes inherited secrets, and a caller's environment secrets, to a
    # reusable workflow only within one organization, and a fork is usually in another (encore-protocol
    # docs/outside-runs.md).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED }}
      ANTHROPIC_API_KEY_CREDITS: ${{ secrets.ANTHROPIC_API_KEY_CREDITS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAPERS_DEPLOY_KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}

  attempt:
    if: ${{ !contains(fromJSON('["claims", "claims-check", "answer"]'), inputs.role) }}
    uses: encorescience/encore-protocol/.github/workflows/attempt.yml@main
    with:
      paper: ${{ inputs.paper }}
      role: ${{ inputs.role }}
      model: ${{ inputs.model }}
      account: ${{ inputs.account }}
      registry: encorescience/encore-registry
      papers_repo: ${{ vars.ENCORE_PAPERS_REPO }}
      accountable: ${{ vars.ENCORE_ACCOUNTABLE }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED }}
      ANTHROPIC_API_KEY_CREDITS: ${{ secrets.ANTHROPIC_API_KEY_CREDITS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAPERS_DEPLOY_KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}
