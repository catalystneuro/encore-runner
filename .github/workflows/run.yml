name: Run
run-name: "${{ inputs.paper }} ${{ inputs.role }}"

# One run of an Encore attempt, sent to the registry (README.md). The protocol's own workflows do the run: papers.yml
# for the reader's claims and their check, attempt.yml for the author. With the input `registry` they read the
# registry, starting from the attempt's branch there, write nothing to it, and end by signing what the run changed
# (encore-protocol docs/outside-runs.md). The `deliver` job then hands the run to the registry's intake.

on:
  workflow_dispatch:
    inputs:
      paper:
        description: "The paper's key in the registry (papers/keys.yaml), such as smith-2020"
        required: true
      role:
        description: "claims, then claims-check until the claims are ready, then author"
        type: choice
        options: [claims, claims-check, author]
        required: true
      model:
        description: "The model the run uses"
        default: claude-opus-5-5

# contents, id-token and attestations: GitHub checks the called workflows' jobs against these, including their
# commit job, which a run from here never reaches. The submit job signs the results with id-token and attestations.
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  REGISTRY: encorescience/encore-registry

jobs:
  # The protocol is pinned to its main branch while this repository is being tried; it moves to a release tag of
  # encore-protocol before anyone else runs it.
  claims:
    if: inputs.role != 'author'
    uses: encorescience/encore-protocol/.github/workflows/papers.yml@fork-secrets
    with:
      paper: ${{ inputs.paper }}
      role: ${{ inputs.role }}
      model: ${{ inputs.model }}
      registry: encorescience/encore-registry
      papers_repo: ${{ vars.ENCORE_PAPERS_REPO }}
      accountable: ${{ vars.ENCORE_ACCOUNTABLE }}
    # By name, not `secrets: inherit`: GitHub passes inherited secrets, and a caller's environment secrets, to a
    # reusable workflow only within one organization, and a fork is usually in another (encore-protocol
    # docs/outside-runs.md).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAPERS_DEPLOY_KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}

  author:
    if: inputs.role == 'author'
    uses: encorescience/encore-protocol/.github/workflows/attempt.yml@fork-secrets
    with:
      paper: ${{ inputs.paper }}
      role: author
      model: ${{ inputs.model }}
      registry: encorescience/encore-registry
      papers_repo: ${{ vars.ENCORE_PAPERS_REPO }}
      accountable: ${{ vars.ENCORE_ACCOUNTABLE }}
    # By name, not `secrets: inherit`: GitHub passes inherited secrets, and a caller's environment secrets, to a
    # reusable workflow only within one organization, and a fork is usually in another (encore-protocol
    # docs/outside-runs.md).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PAPERS_DEPLOY_KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}

  deliver:
    needs: [claims, author]
    if: always() && (needs.claims.result == 'success' || needs.author.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # With ENCORE_INTAKE_TOKEN, a token that may start the registry's workflows (encorescience/encore-runner has
      # one; a fork does not), the run starts the intake and waits for it. Otherwise it says how to send the run.
      - name: Send the run to the registry
        env:
          GH_TOKEN: ${{ secrets.ENCORE_INTAKE_TOKEN }}
          PAPER: ${{ inputs.paper }}
          ROLE: ${{ inputs.role }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$GH_TOKEN" ]; then
            q=$(python3 -c 'import sys, urllib.parse as u; print(u.urlencode({"template": "outside-run.yml", "title": f"Outside run: {sys.argv[2]} {sys.argv[3]}", "run": sys.argv[1]}))' "$run_url" "$PAPER" "$ROLE")
            {
              echo "## Send this run to the registry"
              echo
              echo "The run finished. Send it to the registry with [this issue](https://github.com/$REGISTRY/issues/new?$q), which has the run's address filled in. Someone at CatalystNeuro approves it, and the registry's intake commits it to the attempt's branch and comments on the issue. Start the next run on $PAPER once the issue is closed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Send this run to the registry with an Outside run issue (see the summary)."
            exit 0
          fi
          request="$GITHUB_REPOSITORY_OWNER-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh workflow run intake.yml -R "$REGISTRY" -f run_url="$run_url" -f request="$request"
          id=
          for _ in $(seq 30); do
            sleep 10
            id=$(gh run list -R "$REGISTRY" -w intake.yml -e workflow_dispatch -L 20 --json databaseId,displayTitle \
                   --jq ".[] | select(.displayTitle == \"Intake: $request\") | .databaseId" | head -1)
            [ -z "$id" ] || break
          done
          [ -n "$id" ] || { echo "::error::The registry's intake did not start; send the run with an Outside run issue."; exit 1; }
          echo "Intake: https://github.com/$REGISTRY/actions/runs/$id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" -R "$REGISTRY" --exit-status > /dev/null || {
            echo "::error::The registry did not take the run: https://github.com/$REGISTRY/actions/runs/$id"; exit 1; }
          echo "The registry took the run and committed it to attempt/$PAPER." >> "$GITHUB_STEP_SUMMARY"
